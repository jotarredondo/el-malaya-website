name: Deploy EL MALAYA Website

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: el-malaya-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::393149180272:role/ElMalayaGitHubDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload website to S3
        run: |
          aws s3 sync ./dist/ \
            s3://elmalayainfraestructurestack-websitebucket75c24d94-vgdd9tlzocoi/ \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2RE4RWW3QQODH \
            --paths "/*"
